version: '3.8'

services:
  # ==============================================================================
  # Bot API Webhook Service (FastAPI + aiogram)
  # ==============================================================================
  bot_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book_library_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/booklibrary
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network

  # ==============================================================================
  # PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: book_library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booklibrary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booklibrary"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  # ==============================================================================
  # Redis Cache & Background Tasks
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: book_library_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
